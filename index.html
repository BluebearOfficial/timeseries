<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>时间序列</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>时间序列探索</h1>

  <div>
    <button onclick="load('temperature')">温度</button>
    <button onclick="load('steps')">步数</button>
    <button onclick="load('activity')">活动</button>
    <button onclick="loadCumulative()">累积平均</button>
    <button onclick="loadPeak()">峰值月</button>
    <button onclick="loadMonthTrend()">某月趋势</button>
    <button onclick="loadDaily()">某月每日</button>
    <button onclick="loadHotDays()">酷暑天数</button>
    <button onclick="loadCompare()">活动 vs 步数</button>

<button onclick="loadWeekday()">星期分布</button>

<button onclick="loadMonthDist()">月度分布</button>
<button onclick="loadMovingAvg()">滑动平均</button>

<button onclick="loadCorrelation()">相关性</button>
<button onclick="loadStepsByTemp()">温度 vs 步数</button>

<button onclick="loadActivityByTemp()">温度 vs 活动</button>
<button onclick="loadSeason()">季节天数</button>

<button onclick="exportLast()">导出当前图</button>

<button onclick="loadTop()">排行榜</button>
<div id="topResult"></div>

<div>
  <input id="dayInput" type="date" />
  <button onclick="loadDay()">查询</button>
</div>
<div id="dayResult"></div>

<canvas id="seasonChart"></canvas>
<canvas id="abtChart"></canvas>

<canvas id="sbtChart"></canvas>



<canvas id="maChart"></canvas>
<button onclick="exportCanvas('maChart')">导出这张</button>

<canvas id="monthDistChart"></canvas>

<canvas id="weekdayChart"></canvas>
<canvas id="compareChart"></canvas>


<canvas id="cumChart"></canvas>
  </div>

  <div id="stats"></div>
  <canvas id="chart"></canvas>

<canvas id="peakChart"></canvas>

<canvas id="monthChart"></canvas>

<canvas id="dailyChart"></canvas>

<canvas id="hotChart"></canvas>

   <script src="app.js"></script>
</body>
</html>
