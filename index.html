<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>时间序列</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>时间序列探索</h1>

<div class="group">
  <span class="group-title">基础</span>
  <button onclick="load('temperature')">温度</button>
  <button onclick="load('steps')">步数</button>
  <button onclick="load('activity')">活动</button>
</div>

<div class="group">
  <span class="group-title">趋势</span>
  <button onclick="loadCumulative()">累积平均</button>
  <button onclick="loadPeak()">峰值月</button>
  <button onclick="loadMovingAvg()">滑动平均</button>
  <button onclick="loadSeason()">季节天数</button>
</div>

<div class="group">
  <span class="group-title">分布</span>
  <button onclick="loadWeekday()">星期分布</button>
  <button onclick="loadMonthDist()">月度分布</button>
  <button onclick="loadHotDays()">大幅偏高天数</button>
</div>

<div class="group">
  <span class="group-title">对比</span>
  <button onclick="loadCompare()">活动 vs 步数</button>
  <button onclick="loadStepsByTemp()">温度 vs 步数</button>
  <button onclick="loadActivityByTemp()">温度 vs 活动</button>
  <button onclick="loadCorrelation()">相关性</button>
</div>

<div class="group">
  <span class="group-title">单点</span>
  <button onclick="loadMonthTrend()">某月趋势</button>
  <button onclick="loadDaily()">某月每日</button>
  <button onclick="loadTop()">排行榜</button>
  <input id="dayInput" type="date" />
  <button onclick="loadDay()">查询</button>
  <div id="dayResult"></div>
  <div id="topResult"></div>
</div>

<div class="group">
  <span class="group-title">工具</span>
  <button onclick="exportLast()">导出当前图</button>
</div>

<div class="group">
  <span class="group-title">上传</span>
  <select id="uploadType">
    <option value="temperature">温度</option>
    <option value="steps">步数</option>
    <option value="activity">活动</option>
   
  </select>
  <input type="file" id="uploadFile" accept=".xlsx,.xls" />
  <button onclick="uploadExcel()">上传</button>
  <span id="uploadResult"></span>
</div>

<!-- 日历热力图 -->
<div style="margin-top: 20px;">
  <button onclick="loadCalendar('activity')">活动日历（0/1）</button>
  <button onclick="loadCalendar('steps')">步数日历</button>
  <div id="calendarLegend" style="margin-top: 10px; font-size: 12px; display: flex; gap: 15px;">
    <span><span style="display:inline-block;width:12px;height:12px;background:gold;border-radius:2px;"></span> 必做/必走</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:crimson;border-radius:2px;"></span> 必不做/必宅</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:#e0e0e0;border-radius:2px;"></span> 随机波动</span>
  </div>
  <div id="calendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 450px; margin-top: 10px;"></div>
</div>
<button onclick="loadMonthlyWanbu()">每月万步日</button>
<button onclick="loadYearly10Activity()">年度十啾月</button>
<canvas id="wanbuChart"></canvas>
<canvas id="activity10Chart"></canvas>

<!-- 按钮 -->
<button onclick="loadSlidingGap()">滑动克制度</button>

<!-- 容器 -->
<canvas id="gapChart"></canvas>


<button onclick="showStreakBoard()">修仙排行榜</button>

<div id="topResult"></div>

<button onclick="loadActivityBySteps()">📊 步数 × 活动交叉分析</button>

<canvas id="stepActivityChart"></canvas>

<canvas id="seasonChart"></canvas>
<canvas id="abtChart"></canvas>

<canvas id="sbtChart"></canvas>



<canvas id="maChart"></canvas>


<canvas id="monthDistChart"></canvas>

<canvas id="weekdayChart"></canvas>
<canvas id="compareChart"></canvas>


<canvas id="cumChart"></canvas>
  </div>

  <div id="stats"></div>
  <canvas id="chart"></canvas>

<canvas id="peakChart"></canvas>

<canvas id="monthChart"></canvas>

<canvas id="dailyChart"></canvas>

<canvas id="hotChart"></canvas>

   <script src="app.js"></script>
</body>
</html>
